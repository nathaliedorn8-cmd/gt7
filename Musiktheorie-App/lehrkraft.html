<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lehrkraft · Groove &amp; Theorie</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<style>
  .teacher h1 { font-size: clamp(1.8rem, 6vw, 2.4rem); margin-top: 18px; }
  .teacher h2 { font-size: 1.35rem; margin: 32px 0 10px; }
  .teacher section { margin-bottom: 8px; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .qr-card { background: #fff; color: #111; border-radius: 16px; padding: 14px; text-align: center; border: 3px solid var(--mod); }
  .qr-card svg { width: 100%; max-width: 200px; height: auto; display: block; margin: 0 auto 6px; }
  .qr-card strong { display: block; font-family: var(--display); font-size: 1.05rem; }
  .qr-card small { display: block; word-break: break-all; color: #555; font-size: .72rem; }
  .url-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .url-row .input { flex: 1; min-width: 220px; }
  .warn { border-left: 4px solid var(--c2); background: var(--surface-2); padding: 10px 14px; border-radius: 0 12px 12px 0; }
  .plan td, .plan th { vertical-align: top; }
  .key-table td:first-child { font-weight: 650; }
  .two-col { display: grid; gap: 12px; }
  @media (min-width: 720px) { .two-col { grid-template-columns: 1fr 1fr; } }
  .no-print { }
  @media print {
    :root { --bg: #fff; --surface: #fff; --surface-2: #f2f2f2; --text: #111; --muted: #444; --line: #ccc; }
    body { background: #fff; color: #111; }
    .no-print, .topbar { display: none !important; }
    .qr-card { break-inside: avoid; border-width: 2px; }
    .qr-grid { grid-template-columns: repeat(3, 1fr); }
    h2 { break-after: avoid; }
    table { break-inside: auto; } tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<main id="app" class="page teacher">
  <noscript>Bitte JavaScript aktivieren.</noscript>
</main>
<script src="vendor/qrcode.js"></script>
<script src="vendor/abcjs-basic-min.js"></script>
<script type="module" src="js/lehrkraft.js"></script>
</body>
</html>
